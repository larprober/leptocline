name: build

# Builds the Leptocline packages and the ISO, uploads them as artifacts, and
# (if a GPG secret is set) builds + publishes the APT repo to GitHub Pages.
#
# Releases are cut MANUALLY, not here: the ISO is ~3.8 GB and GitHub caps a
# release asset at 2 GB, so a release ships the ISO split into <2 GB parts with
# a matching SHA256SUMS. Because each live-build run is non-reproducible, the
# published release is one verified image, not whatever a tag rebuild produced.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write      # create releases
  pages: write         # deploy the repo to Pages
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_GPG: ${{ secrets.LEPTO_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      # live-build is a Debian tool; Ubuntu's fork lacks options this config uses
      # (--distribution-chroot, --image-name, ...). Build inside a Debian trixie
      # container so the toolchain matches the WSL build exactly. --privileged is
      # needed for debootstrap's mounts and the squashfs/ISO loop operations.
      - name: Build packages + ISO in a Debian trixie container
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/build -w /build \
            debian:trixie bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso isolinux syslinux-common \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates curl gnupg
              bash packaging/build-packages.sh
              bash build.sh --no-deps
            '

      - name: Install host tooling for repo + release
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Name the artifacts
        id: names
        run: |
          echo "iso=$(ls *.iso | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: leptocline-iso
          path: "*.iso"
          if-no-files-found: error

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: leptocline-debs
          path: packaging/out/*.deb

      # --- signed APT repo, only when the signing key secret is present ---
      - name: Build signed APT repo
        if: env.HAS_GPG == 'true'
        env:
          LEPTO_GPG_PRIVATE_KEY: ${{ secrets.LEPTO_GPG_PRIVATE_KEY }}
        run: |
          echo "$LEPTO_GPG_PRIVATE_KEY" | gpg --batch --import
          export LEPTO_GPG_KEY="$(gpg --list-keys --with-colons 'Linux Leptocline Archive Key' | awk -F: '/^pub/{print $5; exit}')"
          bash repo/make-repo.sh

      - name: Upload repo to Pages
        if: env.HAS_GPG == 'true'
        env:
          LEPTO_GPG_PRIVATE_KEY: ${{ secrets.LEPTO_GPG_PRIVATE_KEY }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/public

  deploy-pages:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy repo to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
